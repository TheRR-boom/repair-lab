name: Android APK

# Собираем debug-APK в облаке: здесь ubuntu-x64, где нормально работает aapt2.
# APK прикрепляется к релизу и доступен кнопкой «Assets» на странице релиза.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # На ubuntu-latest Android SDK уже предустановлен. Ставить его заново
      # через android-actions/setup-android не нужно (и ломается: пакета
      # 'tools' в свежих SDK больше нет).
      - name: Принять лицензии и доустановить SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          ls "$ANDROID_HOME/platforms"

      - name: Зависимости и тесты
        run: |
          npm ci --audit=false
          npm test
          npm run build

      - name: Синхронизировать web-сборку с Android
        run: npx cap sync android

      - name: Собрать debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Переименовать APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "artifacts/repair-lab-${{ github.run_number }}-debug.apk"
          ls -lh artifacts

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: repair-lab-debug-apk
          path: artifacts/*.apk
          retention-days: 30

      - name: Прикрепить APK к релизу
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Repair Lab · сборка ${{ github.run_number }}
          body: |
            Debug-APK, собранный автоматически из коммита ${{ github.sha }}.

            Установка: скачайте `.apk` ниже, разрешите установку из неизвестного
            источника и откройте файл. Debug-подпись — нормально для тестов,
            для Google Play нужен подписанный release-сборка.
          files: artifacts/*.apk
          draft: false
          prerelease: false